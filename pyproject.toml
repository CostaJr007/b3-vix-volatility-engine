[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-vix-volatility-engine"
version = "1.0.0"
description = "Institutional Volatility Engine for Brazilian Equities (B3): VIXBOVA Index Replication, DI1 Yield Curve Discounting, GARCH(1,1), and RTD Platform Feeds"
readme = "README.md"
authors = [
  { name = "Costa Junior", email = "adeilsonjc@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.scripts]
b3-vix = "b3_vix.cli:main"

[project.urls]
Homepage = "https://github.com/CostaJr007/b3-vix-volatility-engine"
Repository = "https://github.com/CostaJr007/b3-vix-volatility-engine"
